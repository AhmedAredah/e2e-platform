name: languages

on:
  pull_request:
  push:
    branches: [mit-main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  E2E_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'
  E2E_PYTHON: python
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  cli-and-http:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # Security-only 3.12 patches do not have builds for every runner OS.
          python-version: '3.12'
          check-latest: true
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.402'
      - name: Select the Rust compiler
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup override set 1.99.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:native
      - run: node --test scripts/languages/report.test.mjs scripts/languages/service.test.mjs
      - run: node scripts/languages/verify.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: languages-${{ matrix.os }}
          path: |
            .e2e/languages/verification.json
            examples/with-languages/build/runtime-manifest.json
            examples/with-languages/.e2e/
          include-hidden-files: true
          if-no-files-found: warn
