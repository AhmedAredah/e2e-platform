name: native

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  E2E_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  command-and-packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare the optional macOS terminal peer
        if: runner.os == 'macOS'
        run: |
          pnpm build:native
          node packages/terminal/dist/cli/setup.js
      - run: pnpm test:native
      - run: pnpm test:scripts
      - run: node scripts/native/verify.mjs
      - run: node scripts/native/verify-cpp-sdk.mjs
      - run: node scripts/native/install-kit-smoke.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-command-${{ matrix.os }}
          path: |
            .e2e/cpp/
            examples/with-cpp-cli/build/ctest-results.xml
            examples/with-cpp-cli/.e2e/
          include-hidden-files: true
          if-no-files-found: warn

  qt-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - display: offscreen
            platform: offscreen
          - display: x11
            platform: xcb
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: ${{ matrix.platform }}
      E2E_REQUIRE_QPA_PLATFORM: ${{ matrix.platform }}
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Install Qt development and QML runtime modules
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtqml-workerscript qml6-module-qtquick-templates qml6-module-qtquick-window
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:native
      - name: Verify Widgets and Quick through the selected display backend
        run: ${{ matrix.display == 'x11' && 'xvfb-run -a' || '' }} node scripts/native/verify.mjs --qt-only --require-quick
      - name: Run installed C++ authored Qt tests
        run: ${{ matrix.display == 'x11' && 'xvfb-run -a' || '' }} node scripts/native/verify-cpp-sdk.mjs --qt
      - name: Drive isolated installed static and shared Qt helpers
        run: ${{ matrix.display == 'x11' && 'xvfb-run -a' || '' }} node scripts/native/verify-qt-install.mjs
      - name: Verify exported data and masked captures
        run: ${{ matrix.display == 'x11' && 'xvfb-run -a' || '' }} node scripts/native/qt-export-proof.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qt-linux-${{ matrix.display }}
          path: |
            .e2e/cpp/
            examples/with-qt/build/ctest-results.xml
            examples/with-qt/e2e/.e2e/
          include-hidden-files: true
          if-no-files-found: warn

  qt-desktop-kits:
    # Verify headless and native-window profiles separately; neither bypasses OS focus policy.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            host: windows
            arch: win64_msvc2022_64
            platform: offscreen
            style: Windows
          - os: windows-2022
            host: windows
            arch: win64_msvc2022_64
            platform: windows
            style: Windows
          - os: macos-15
            host: mac
            arch: clang_64
            platform: offscreen
            style: Basic
          - os: macos-15
            host: mac
            arch: clang_64
            platform: cocoa
            style: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: ${{ matrix.platform }}
      E2E_REQUIRE_QPA_PLATFORM: ${{ matrix.platform }}
      QT_QUICK_BACKEND: software
      QT_QUICK_CONTROLS_STYLE: ${{ matrix.style }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.1
          cache: pnpm
      # Community-maintained installer; downloads Qt's official public binaries.
      - uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.3'
          host: ${{ matrix.host }}
          target: desktop
          arch: ${{ matrix.arch }}
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:native
      - run: node scripts/native/verify.mjs --qt-only --require-quick
      - run: node scripts/native/verify-cpp-sdk.mjs --qt
      - run: node scripts/native/verify-qt-install.mjs
      - run: node scripts/native/qt-export-proof.mjs
      - name: Capture a native backtrace after macOS Qt failure
        if: failure() && runner.os == 'macOS'
        run: node scripts/native/qt-crash-diagnostics.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: qt-${{ matrix.os }}-6.8.3-${{ matrix.platform }}-${{ matrix.style }}
          path: |
            .e2e/cpp/
            examples/with-qt/build/ctest-results.xml
            examples/with-qt/e2e/.e2e/
          include-hidden-files: true
          if-no-files-found: warn
