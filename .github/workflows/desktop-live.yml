name: desktop-live

# Requires prepared interactive hosts. Missing permission/session is a failure.
on:
  workflow_dispatch:
    inputs:
      backend:
        description: Native backend to qualify
        required: true
        type: choice
        options: [linux-atspi, windows-uia, macos-ax]

permissions:
  contents: read

jobs:
  linux:
    if: inputs.backend == 'linux-atspi'
    runs-on: [self-hosted, Linux, e2e-desktop]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 -m unittest discover -s native/linux-atspi/tests -v
      - run: python3 native/linux-atspi/tests/live_smoke.py

  windows:
    if: inputs.backend == 'windows-uia'
    runs-on: [self-hosted, Windows, e2e-desktop]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: dotnet build native/windows-uia/src/Driver/E2E.Platform.WindowsUia.csproj -c Release
      - run: dotnet build examples/with-desktop/dotnet/AccessibleDemo.csproj -c Release
      - run: python native/windows-uia/tests/live_smoke.py --driver native/windows-uia/build/bin/E2E.Platform.WindowsUia/Release/net10.0-windows/E2E.Platform.WindowsUia.exe --app examples/with-desktop/dotnet/build/bin/Release/net10.0-windows/AccessibleDemo.exe

  macos:
    if: inputs.backend == 'macos-ax'
    runs-on: [self-hosted, macOS, e2e-desktop]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: cargo build --locked --manifest-path native/macos-ax/Cargo.toml
      - run: cargo build --locked --manifest-path examples/with-desktop/rust/Cargo.toml
      - run: python3 native/macos-ax/scripts/verify-macos.py --driver native/macos-ax/target/debug/e2e-platform-macos-ax --app examples/with-desktop/rust/target/debug/e2e-desktop-rust-demo
