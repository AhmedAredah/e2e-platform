packages:
  - packages/*
  - apps/*
  - docs
  - examples/with-cpp-cli
  - examples/with-cpp-sdk
  - examples/with-qt/e2e
  - examples/with-languages

# pnpm 12 refuses versions published less than a day ago by default. Exact pins
# already decide what we install, so the delay only blocks deliberate bumps.
minimumReleaseAge: 0

# e2e and @e2e-platform/playwright develop against each other; pnpm 12 would
# otherwise refuse to run recursive scripts across that cycle.
ignoreWorkspaceCycles: true

allowBuilds:
  esbuild: true
  '@scarf/scarf': false
  keytar: false
  puppeteer: false
  sharp: false
  node-pty: true

# Security fixes are scoped to compatible dependency lines. The private mobile
# showcase and optional docs tooling still have upstream advisories; see RELEASE_STATUS.md.
overrides:
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'js-yaml@<3.15.2': 3.15.2
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'nanoid@<3.3.18': 3.3.18
  'undici@>=7.0.0 <7.30.1': 7.30.1
  'ip-address@>=10.0.0 <10.7.4': 10.7.4
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
