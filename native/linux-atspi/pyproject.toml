[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "e2e-platform-atspi"
version = "0.1.0"
description = "Owned Linux AT-SPI desktop driver for the e2e-platform testing runner"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"

[project.scripts]
e2e-platform-atspi = "e2e_atspi.application:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["e2e_atspi*"]
