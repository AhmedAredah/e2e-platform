version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
    groups:
      dev-tooling:
        dependency-type: development
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(ci)'
  - package-ecosystem: pip
    directory: /native/linux-atspi
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: cargo
    directories:
      - /native/macos-ax
      - /examples/with-desktop/rust
      - /examples/with-languages/apps/rust
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(deps)'
  - package-ecosystem: nuget
    directories:
      - /native/windows-uia/src/Driver
      - /native/windows-uia/src/Protocol
      - /native/windows-uia/tests/ProtocolTests
      - /examples/with-desktop/dotnet
      - /examples/with-languages/apps/dotnet
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: 'chore(deps)'
