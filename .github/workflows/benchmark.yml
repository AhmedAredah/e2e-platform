name: benchmark

# Deterministic tests run automatically; provider-backed tests require dispatch.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_agent:
        description: Run the provider-backed suite (uses configured credentials)
        type: boolean
        default: false

# The repository's own runs are not usage: the CLI sends no telemetry from CI here.
env:
  E2E_TELEMETRY_DISABLED: '1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm --filter @e2e-platform/playwright exec playwright install chromium --with-deps
      - name: Build
        run: pnpm run build
      - name: Run test
        run: pnpm --filter @e2e-platform/web-benchmark run test
      # Preserve reports as workflow artifacts; no pull-request messages are sent.
      - name: Upload report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-benchmark-web
          path: |
            apps/web-benchmark/.e2e/report.json
            apps/web-benchmark/.e2e/artifacts
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  # The agentic suite spends real model calls, cents per run, and needs the
  # key: a fork's pull request has none, so it is skipped rather than failed.
  web-agent:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_agent }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: web agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm
      # A missing credential fails every agent step with MODEL_UNAVAILABLE,
      # which reads as a product defect. Say what is actually wrong instead.
      - name: Require model credential
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          if [ -z "$AI_GATEWAY_API_KEY" ]; then
            echo "::error::AI_GATEWAY_API_KEY is not set for this repository." \
              "The agentic suite needs a real provider credential."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Install browsers
        run: pnpm --filter @e2e-platform/playwright exec playwright install chromium --with-deps
      - name: Build
        run: pnpm run build
      - name: Run test:agent
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: pnpm --filter @e2e-platform/web-benchmark run test:agent
      - name: Upload report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-benchmark-web-agent
          path: |
            apps/web-benchmark/.e2e/report.json
            apps/web-benchmark/.e2e/artifacts
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
