name: local-install-kit

# Manual qualification and local artifacts only: no registry publication or release PR.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  E2E_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  desktop-contracts:
    uses: ./.github/workflows/desktop-contracts.yml

  language-platforms:
    uses: ./.github/workflows/languages.yml

  python-platforms:
    uses: ./.github/workflows/python.yml

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:local
      - run: pnpm --filter @e2e-platform/playwright exec playwright install chromium --with-deps
      # Includes core/security integrations, every public package and script tests.
      # Provider tests use local mock servers; live-provider suites are excluded.
      - run: pnpm test

  native-platforms:
    uses: ./.github/workflows/native.yml

  package:
    needs: [quality, native-platforms, language-platforms, desktop-contracts, python-platforms]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install build==1.6.1
      - run: pnpm pack:native
      - run: node scripts/python/package.mjs --python python --out release-packages/python
      # Validate the exact nine tarballs that the next step uploads.
      - run: node scripts/native/install-kit-smoke.mjs --kit release-packages
      - run: git rev-parse HEAD > release-packages/source-revision.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-platform-local-install-kit-${{ github.sha }}
          path: release-packages/
          if-no-files-found: error
