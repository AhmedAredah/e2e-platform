name: native

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  E2E_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  command-and-packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare the optional macOS terminal peer
        if: runner.os == 'macOS'
        run: |
          pnpm build:native
          node packages/terminal/dist/cli/setup.js
      - run: pnpm test:native
      - run: pnpm test:scripts
      - run: node scripts/native/verify.mjs
      - run: node scripts/native/install-kit-smoke.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-command-${{ matrix.os }}
          path: |
            .e2e/cpp/
            examples/with-cpp-cli/build/ctest-results.xml
            examples/with-cpp-cli/.e2e/
          include-hidden-files: true
          if-no-files-found: warn

  qt-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Install Qt development and QML runtime modules
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtqml-workerscript qml6-module-qtquick-templates qml6-module-qtquick-window
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:native
      - run: node scripts/native/verify.mjs --qt-only --require-quick
      - run: pnpm verify:qt:install
      - run: pnpm verify:qt:exports
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: qt-linux-offscreen
          path: |
            .e2e/cpp/
            examples/with-qt/build/ctest-results.xml
            examples/with-qt/e2e/.e2e/
          include-hidden-files: true
          if-no-files-found: warn
