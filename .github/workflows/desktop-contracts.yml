name: desktop-contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  linux-atspi:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install accessibility and display prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-atspi-2.0 gir1.2-gtk-3.0 at-spi2-core dbus-x11 xvfb xauth
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:native
      - name: Shared runner and Python protocol interoperability
        env:
          E2E_TEST_PYTHON: /usr/bin/python3
        run: pnpm --filter @e2e-platform/native test
      - run: python3 -m unittest discover -s native/linux-atspi/tests -v
      - name: Real GTK accessible controls
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 native/linux-atspi/tests/live_smoke.py
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install ./sdks/python
      - run: python -c "import os,sys;open(os.environ['GITHUB_ENV'],'a').write('E2E_SDK_PYTHON='+sys.executable+'\n')"
      - name: Installed TypeScript, C++ and Python desktop consumers
        run: >-
          dbus-run-session -- xvfb-run -a node scripts/native/verify-desktop-consumer.mjs
          --backend linux-atspi --driver /usr/bin/python3
          --driver-arg "${{ github.workspace }}/native/linux-atspi/driver.py"
          --app /usr/bin/python3 --app-arg "${{ github.workspace }}/examples/with-desktop/python/gtk_controls.py"
          --wrong-arg=--wrong --python "$E2E_SDK_PYTHON"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: desktop-consumer-linux
          path: .e2e/desktop-consumer/
          include-hidden-files: true


  windows-uia:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.402'
      - run: dotnet run --project native/windows-uia/tests/ProtocolTests/E2E.Platform.Desktop.Protocol.Tests.csproj -c Release
      - run: dotnet build native/windows-uia/src/Driver/E2E.Platform.WindowsUia.csproj -c Release
      - run: dotnet build examples/with-desktop/dotnet/AccessibleDemo.csproj -c Release
      - name: Exercise real WPF accessible controls and owned cleanup
        run: python native/windows-uia/tests/live_smoke.py --driver native/windows-uia/build/bin/E2E.Platform.WindowsUia/Release/net10.0-windows/E2E.Platform.WindowsUia.exe --app examples/with-desktop/dotnet/build/bin/Release/net10.0-windows/AccessibleDemo.exe
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:native
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install ./sdks/python
      - run: python -c "import os,sys;open(os.environ['GITHUB_ENV'],'a').write('E2E_SDK_PYTHON='+sys.executable+'\n')"
      - name: Installed TypeScript, C++ and Python desktop consumers
        run: >-
          node scripts/native/verify-desktop-consumer.mjs --backend windows-uia
          --driver native/windows-uia/build/bin/E2E.Platform.WindowsUia/Release/net10.0-windows/E2E.Platform.WindowsUia.exe
          --app examples/with-desktop/dotnet/build/bin/Release/net10.0-windows/AccessibleDemo.exe --wrong-arg=--planted-bug --python "$env:E2E_SDK_PYTHON"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: desktop-consumer-windows
          path: .e2e/desktop-consumer/
          include-hidden-files: true


  rust-ax:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select compiler
        run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo +1.99.1 test --locked --manifest-path native/macos-ax/Cargo.toml
      - if: runner.os == 'macOS'
        run: cargo +1.99.1 build --locked --manifest-path examples/with-desktop/rust/Cargo.toml
      - if: runner.os == 'macOS'
        run: cargo +1.99.1 build --locked --manifest-path native/macos-ax/Cargo.toml
      - name: Exercise real AppKit accessibility with permission required
        if: runner.os == 'macOS'
        run: python3 native/macos-ax/scripts/verify-macos.py --driver native/macos-ax/target/debug/e2e-platform-macos-ax --app examples/with-desktop/rust/target/debug/e2e-desktop-rust-demo
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
        if: runner.os == 'macOS'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: runner.os == 'macOS'
        with:
          node-version: 24.22.1
          cache: pnpm
      - if: runner.os == 'macOS'
        run: pnpm install --frozen-lockfile
      - if: runner.os == 'macOS'
        run: pnpm build:native
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        if: runner.os == 'macOS'
        with:
          python-version: '3.12'
      - if: runner.os == 'macOS'
        run: python -m pip install ./sdks/python
      - if: runner.os == 'macOS'
        run: python -c "import os,sys;open(os.environ['GITHUB_ENV'],'a').write('E2E_SDK_PYTHON='+sys.executable+'\n')"
      - name: Installed TypeScript, C++ and Python desktop consumers
        if: runner.os == 'macOS'
        run: >-
          node scripts/native/verify-desktop-consumer.mjs --backend macos-ax
          --driver native/macos-ax/target/debug/e2e-platform-macos-ax
          --app examples/with-desktop/rust/target/debug/e2e-desktop-rust-demo --wrong-arg=--wrong --python "$E2E_SDK_PYTHON"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && runner.os == 'macOS'
        with:
          name: desktop-consumer-macos
          path: .e2e/desktop-consumer/
          include-hidden-files: true


  windows-process:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.402'
      - name: Check strict supervisor protocol
        run: dotnet run --project native/windows-process/tests/ProtocolTests/E2E.Platform.WindowsProcess.Protocol.Tests.csproj -c Release
      - name: Build supervisor and adversarial process fixture
        run: |
          dotnet publish native/windows-process/src/Driver/E2E.Platform.WindowsProcess.csproj -c Release -r win-x64 --self-contained false -o build/windows-process
          dotnet publish native/windows-process/tests/ProcessFixture/E2E.Platform.WindowsProcess.Fixture.csproj -c Release -r win-x64 --self-contained false -o build/windows-process-fixture
      - name: Verify actual Windows Job Object lifecycle
        run: python native/windows-process/tests/live_smoke.py --helper build/windows-process/E2E.Platform.WindowsProcess.exe --fixture build/windows-process-fixture/E2E.Platform.WindowsProcess.Fixture.exe
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @e2e-platform/core run build
      - run: pnpm --filter @e2e-platform/process run build
      - name: Verify TypeScript client against the actual Windows supervisor
        shell: pwsh
        run: |
          $env:E2E_WINDOWS_JOB_HELPER = (Resolve-Path build/windows-process/E2E.Platform.WindowsProcess.exe).Path
          $env:E2E_WINDOWS_JOB_FIXTURE = (Resolve-Path build/windows-process-fixture/E2E.Platform.WindowsProcess.Fixture.exe).Path
          pnpm --filter @e2e-platform/process exec vitest run tests/integration/windows-job.native.test.ts
