[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "e2e-platform"
version = "0.2.0rc8"
description = "Python test authoring through E2E Platform's shared desktop, process and browser runner"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = ["pytest>=8.4,<10"]

[project.optional-dependencies]
asyncio = ["pytest-asyncio>=1.2,<2"]

[project.entry-points.pytest11]
e2e_platform = "e2e_platform.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
e2e_platform = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
