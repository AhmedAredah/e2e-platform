name: qt-live

# Prepared, trusted interactive hosts only. This workflow never runs on pull requests.
on:
  workflow_dispatch:
    inputs:
      os:
        description: Prepared host operating system with a matching installed Qt development kit
        required: true
        type: choice
        options: [Linux, Windows, macOS]
      qpa:
        description: Required real desktop QPA plugin (xcb/wayland on Linux, windows on Windows, cocoa on macOS)
        required: true
        type: choice
        options: [xcb, wayland, windows, cocoa]

permissions:
  contents: read

jobs:
  interactive-qt:
    runs-on: [self-hosted, '${{ inputs.os }}', e2e-desktop]
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: ${{ inputs.qpa }}
      E2E_REQUIRE_QPA_PLATFORM: ${{ inputs.qpa }}
      E2E_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Check the selected host and desktop plugin agree
        run: node scripts/native/require-desktop-profile.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:native
      - name: Exercise Widgets and Quick and reject both planted errors
        run: node scripts/native/verify.mjs --qt-only --require-quick
      - name: Run installed C++ authored Qt tests
        run: node scripts/native/verify-cpp-sdk.mjs --qt
      - name: Exercise installed static and shared helpers
        run: node scripts/native/verify-qt-install.mjs
      - name: Retain independently checked exports and masked captures
        run: node scripts/native/qt-export-proof.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: qt-live-${{ inputs.os }}-${{ inputs.qpa }}
          path: |
            .e2e/cpp/
            examples/with-qt/build/ctest-results.xml
            examples/with-qt/e2e/.e2e/
          include-hidden-files: true
          if-no-files-found: warn
